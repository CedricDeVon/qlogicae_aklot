name: TypeScript | Quality Assurance

on:
    push:
    pull_request:

jobs:
    unit-test:
        name: Unit Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: cd typescript
            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:unit

    benchmark-test:
        name: Benchmark Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: cd typescript
            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:benchmark

    install-via-npm-on-node-22:
        name: Install via npm on Node 22
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: cd typescript
            - run: sleep 30
            - run: npm install qlogicae_aklot@latest

    install-via-pnpm-on-node-22:
        name: Install via pnpm on Node 22
        runs-on: ubuntu-latest

        steps:
            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: cd typescript
            - run: sleep 30
            - run: pnpm add qlogicae_aklot@latest

    install-via-yarn-on-node-22:
        name: Install via yarn on Node 22
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: cd typescript
            - run: sleep 30
            - run: yarn add qlogicae_aklot@latest

    install-via-bun-on-node-22:
        name: Install via bun on Node 22
        runs-on: ubuntu-latest

        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  node-version: 22
                  bun-version: latest

            - run: cd typescript
            - run: sleep 30
            - run: bun add qlogicae_aklot@latest

    install-via-npm-on-node-24:
        name: Install via npm on Node 24
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                    
            - run: cd typescript
            - run: sleep 30
            - run: npm install qlogicae_aklot@latest

    install-via-pnpm-on-node-24:
        name: Install via pnpm on Node 24
        runs-on: ubuntu-latest

        steps:
            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - run: cd typescript
            - run: sleep 30
            - run: pnpm add qlogicae_aklot@latest

    install-via-yarn-on-node-24:
        name: Install via yarn on Node 24
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - run: cd typescript
            - run: sleep 30
            - run: yarn add qlogicae_aklot@latest

    install-via-bun-on-node-24:
        name: Install via bun on Node 24
        runs-on: ubuntu-latest

        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  node-version: 24
                  bun-version: latest

            - run: cd typescript
            - run: sleep 30
            - run: bun add qlogicae_aklot@latest
