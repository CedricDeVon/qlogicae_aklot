name: Quality Assurance

on:
    push:
    pull_request:

jobs:
    unit-test:
        name: Unit Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:unit

    benchmark-test:
        name: Benchmark Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:benchmark

    install-via-npm:
        name: Install via npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: npm install qlogicae_aklot@latest

    install-via-pnpm:
        name: Install via pnpm
        runs-on: ubuntu-latest

        steps:
            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: pnpm add qlogicae_aklot@latest

    install-via-yarn:
        name: Install via yarn
        runs-on: ubuntu-latest

        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: yarn add qlogicae_aklot@latest

    install-via-bun:
        name: Install via bun
        runs-on: ubuntu-latest

        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun add qlogicae_aklot@latest
